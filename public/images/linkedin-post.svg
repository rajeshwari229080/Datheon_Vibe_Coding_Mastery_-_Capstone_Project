      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="postShadow" x="-3%" y="-4%" width="106%" height="108%" filterUnits="userSpaceOnUse">
