<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" fill="none">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="cardDrop" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" rx="16" fill="url(#matrixBg)"/>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="15.5" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Section Title -->
  <g transform="translate(60, 36)">
    <rect width="186" height="24" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="93" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">PLATFORM CAPABILITIES</text>
    
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0F172A">
      Engineered for High-Velocity Product Execution
    </text>
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#64748B">
      Four robust pillars bridging initial concept, resilient storage, intelligent strategy, and enterprise-grade isolation
    </text>
  </g>

  <!-- ================= 4-CARD BENTO GRID ================= -->
  <!-- CARD 1: Zero-Flicker Adaptive Theming -->
  <g transform="translate(60, 135)" filter="url(#cardDrop)">
    <rect width="525" height="165" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Icon Container -->
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#EEF2FF"/>
    <!-- Sun/Moon Icon -->
    <circle cx="40" cy="40" r="8" fill="#4F46E5"/>
    <path d="M 40,26 L 40,29 M 40,51 L 40,54 M 26,40 L 29,40 M 51,40 L 54,40" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>

    <!-- Card Content -->
    <text x="74" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Zero-Flicker Theme Engine</text>
    <text x="74" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#4F46E5">Task 1: Responsive UI &amp; Accessibility</text>

    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
      Instant client-side hydration eliminates Flash of Unstyled Content (FOUC).
    </text>
    <text x="20" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
      Pre-configured light &amp; dark design tokens strictly verify WCAG 2.2 AA contrast.
    </text>

    <!-- Badges Row -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="112" height="22" rx="4" fill="#F1F5F9"/>
      <text x="56" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">CSS Design Tokens</text>

      <rect x="120" y="0" width="108" height="22" rx="4" fill="#F1F5F9"/>
      <text x="174" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">Zero Layout Shift</text>

      <rect x="236" y="0" width="112" height="22" rx="4" fill="#F0FDF4"/>
      <text x="292" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#15803D" text-anchor="middle">WCAG 2.2 AA Pass</text>
    </g>
  </g>

  <!-- CARD 2: Supabase Cloud & CRUD Engine -->
  <g transform="translate(615, 135)" filter="url(#cardDrop)">
    <rect width="525" height="165" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Icon Container -->
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#ECFDF5"/>
    <!-- Database Icon -->
    <ellipse cx="40" cy="33" rx="10" ry="4" fill="#10B981"/>
    <path d="M 30,33 L 30,47 Q 40,51 50,47 L 50,33" fill="none" stroke="#10B981" stroke-width="2"/>
    <path d="M 30,40 Q 40,44 50,40" fill="none" stroke="#10B981" stroke-width="2"/>

    <!-- Card Content -->
    <text x="74" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Cloud PostgreSQL &amp; CRUD Engine</text>
    <text x="74" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10B981">Task 2: Supabase Relational Schema</text>

    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
      Full lifecycle management for initiatives and tasks with optimistic UI updates.
    </text>
    <text x="20" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
      Automated cascade deletions and dual-mode resilient local storage mirroring.
    </text>

    <!-- Badges Row -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="104" height="22" rx="4" fill="#F1F5F9"/>
      <text x="52" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">PostgreSQL 16</text>

      <rect x="112" y="0" width="106" height="22" rx="4" fill="#F1F5F9"/>
      <text x="165" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">Optimistic State</text>

      <rect x="226" y="0" width="124" height="22" rx="4" fill="#EFF6FF"/>
      <text x="288" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Offline Local Mirror</text>
    </g>
  </g>

  <!-- CARD 3: Server-Side AI Copilot Orchestrator -->
  <g transform="translate(60, 320)" filter="url(#cardDrop)">
    <rect width="525" height="165" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Icon Container -->
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#F5F3FF"/>
    <!-- Sparkle / AI Icon -->
    <circle cx="40" cy="40" r="8" fill="#7C3AED"/>
    <path d="M 40,28 L 42,36 L 50,38 L 42,40 L 40,48 L 38,40 L 30,38 L 38,36 Z" fill="#FFFFFF"/>

    <!-- Card Content -->
    <text x="74" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Server-Side AI Copilot Orchestration</text>
    <text x="74" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7C3AED">Task 3: Multi-Provider LLM Integration</text>

    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
      Synthesizes natural-language vision into phased roadmaps and prioritized tasks.
    </text>
    <text x="20" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
      Supports OpenAI GPT-4o-mini, Gemini, and local deterministic synthesis fallback.
    </text>

    <!-- Badges Row -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="108" height="22" rx="4" fill="#F1F5F9"/>
      <text x="54" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">GPT-4o &amp; Gemini</text>

      <rect x="116" y="0" width="128" height="22" rx="4" fill="#F1F5F9"/>
      <text x="180" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">Structured Schemas</text>

      <rect x="252" y="0" width="120" height="22" rx="4" fill="#FAF5FF"/>
      <text x="312" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#6B21A8" text-anchor="middle">1-Click Deliverable Sync</text>
    </g>
  </g>

  <!-- CARD 4: Kernel-Level Multi-Tenant Data Isolation (RLS) -->
  <g transform="translate(615, 320)" filter="url(#cardDrop)">
    <rect width="525" height="165" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Icon Container -->
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#EFF6FF"/>
    <!-- Shield / Security Icon -->
    <path d="M 40,28 L 48,32 L 48,42 Q 40,48 40,51 Q 40,48 32,42 L 32,32 Z" fill="#2563EB"/>
    <circle cx="40" cy="38" r="2.5" fill="#FFFFFF"/>

    <!-- Card Content -->
    <text x="74" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Enterprise Data Isolation &amp; Security</text>
    <text x="74" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2563EB">Task 4: Production Ready Verification</text>

    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
      Enforces PostgreSQL Row Level Security (RLS) directly at database kernel level.
    </text>
    <text x="20" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
      Visitor leads are write-only. 100% test coverage with automated Vitest suites.
    </text>

    <!-- Badges Row -->
    <g transform="translate(20, 122)">
      <rect x="0" y="0" width="112" height="22" rx="4" fill="#F1F5F9"/>
      <text x="56" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">RLS Multi-Tenant</text>

      <rect x="120" y="0" width="114" height="22" rx="4" fill="#F1F5F9"/>
      <text x="177" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#334155" text-anchor="middle">Write-Only Leads</text>

      <rect x="242" y="0" width="112" height="22" rx="4" fill="#F0FDF4"/>
      <text x="298" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#15803D" text-anchor="middle">100% Vitest Green</text>
    </g>
  </g>
</svg>
